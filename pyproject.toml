[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggui"
version = "4.0.0"
description = "PyQt5 interface for preparing and running BlastFoam/OpenFOAM cases"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "GGUI contributors" }]
dependencies = [
    "PyQt5>=5.15.0,<5.16",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "pyvista>=0.43,<0.47",
    "vtk>=9.2,<9.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]
test = []

# Flat module layout: dependency metadata only (no installable package tree).
[tool.setuptools]
py-modules = ["ggui_logging", "wsl_runtime", "execution_plan", "state_machine_2d"]

# ---------------------------------------------------------------------------
# External (non-Python) runtime requirements
# ---------------------------------------------------------------------------
# OpenFOAM and BlastFoam are required to prepare meshes and run solvers.
# They are installed outside pip (typically under WSL/Linux) and are not
# declared as Python package dependencies.
